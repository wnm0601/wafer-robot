[platformio]
default_envs = mega_locked

[env:mega_locked]
platform = atmelavr@5.2.0
board = megaatmega2560
framework = arduino
build_flags = -DCART_PHYSICAL_OUTPUT=0
build_src_flags = -Wall -Wextra -Werror
monitor_speed = 115200

[env:mega_manual]
extends = env:mega_locked
build_flags = -DCART_PHYSICAL_OUTPUT=1

; Explicit operator-confirmed bench profile. No A8 feedback; never auto-arm.
[env:mega_manual_no_feedback]
extends = env:mega_locked
; avrdude wiring performs its own reset; avoid the extra unbounded pyserial pre-open.
board_upload.disable_flushing = yes
build_flags =
    -DCART_PHYSICAL_OUTPUT=1
    -DCART_OPERATOR_POWER_ACK=1
    -DCART_PROTOCOL_MAX_PERCENT=40
    -DCART_PHYSICAL_LIMIT_PERCENT=40

; Legacy electrical conversion/ramp ONLY. Same guarded protocol and manual UI.
; No upload is performed by build. Encoder fault/lease/ARM safeguards stay enabled.
[env:mega_manual_legacy_ramp]
extends = env:mega_manual_no_feedback
build_flags =
    ${env:mega_manual_no_feedback.build_flags}
    -DCART_RAMP_STEP=8
    -DCART_PWM_DENOMINATOR=255

; Old webcam/LiDAR electrical timing on CURRENT PCB pins and Timer1/5.
; Not the old unframed protocol, wheel mapping or automatic drive behavior.
[env:mega_manual_legacy_5khz]
extends = env:mega_manual_legacy_ramp
build_flags =
    ${env:mega_manual_legacy_ramp.build_flags}
    -DCART_PWM_TOP=3199
    -DCART_STALL_MS=1500
